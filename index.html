<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffe3ee"><title>Dành riêng cho Hoa 💗</title><style>
:root{--pink:#ff6fa9;--deep:#9e315f;--cream:#fff9fc}*{box-sizing:border-box}body{margin:0;color:#71344e;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:radial-gradient(circle at 20% 10%,#fff 0,#fff0f6 34%,#ffd6e7 100%);min-height:100vh;overflow-x:hidden}.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.petal{position:absolute;top:-10vh;animation:fall linear infinite;opacity:.6}@keyframes fall{to{transform:translateY(115vh) rotate(420deg)}}main{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(760px,100%);min-height:78vh;background:#ffffffd9;border:1px solid #fff;box-shadow:0 20px 70px #d86a9630;border-radius:30px;padding:clamp(22px,5vw,48px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;backdrop-filter:blur(10px);position:relative;overflow:hidden}.eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:.76rem;color:#c05b83}.title{font-family:Georgia,serif;font-size:clamp(2.2rem,7vw,4.3rem);line-height:1.12;margin:14px 0;color:#bd4778;text-shadow:0 3px 0 white}.heart{font-size:2rem;animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:scale(1.2)}}.copy{font-size:clamp(1.03rem,2.5vw,1.23rem);line-height:1.95;white-space:pre-line;max-width:610px;margin:8px auto 22px}.photo{width:min(100%,520px);max-height:56vh;object-fit:contain;border-radius:22px;box-shadow:0 12px 35px #8f3b5b2a;border:5px solid white;animation:appear .8s ease both}@keyframes appear{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}.caption{font-size:1.1rem;line-height:1.8;margin:20px 0 8px}.btn{border:0;border-radius:999px;padding:14px 28px;background:linear-gradient(135deg,#ff8db8,#e65391);color:white;font-weight:700;font-size:1rem;box-shadow:0 8px 20px #e6539140;cursor:pointer;margin-top:12px}.btn:active{transform:scale(.97)}.dots{font-size:.85rem;color:#c06c8e;margin-top:20px}.hidden{display:none}.floating{position:fixed;pointer-events:none;z-index:2;animation:floatup 2.8s ease-out forwards;font-size:22px}@keyframes floatup{0%{opacity:0;transform:translateY(15px) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-170px) rotate(18deg) scale(1.3)}}.count{font-size:4rem;font-weight:800;color:#df5b99;animation:pop .65s ease}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:520px){main{padding:12px}.card{min-height:84vh;border-radius:24px;padding:22px 18px}.photo{max-height:48vh}.copy{line-height:1.8}}
</style></head><body><div class="petals" id="petals"></div><main><section class="card" id="card"><div class="eyebrow">Một món quà nhỏ dành cho em</div><div class="heart">💗</div><h1 class="title">Dành riêng cho Hoa</h1><p class="copy">Có một món quà bé xíu đang chờ em mở nè.
Sẵn sàng chưa? 🌷</p><button class="btn" id="start">Mở quà 💝</button><div class="dots">Made with care ♡</div></section></main><script>
const scenes=[
{type:'text',tag:'CẢNH 1 · NGÀY ĐẶC BIỆT',title:'Hoa ơi, chúc mừng 20/10! 💗',text:'Hôm nay là ngày đặc biệt của phái đẹp, nên anh có một nhiệm vụ rất quan trọng muốn giao cho em…\n\nĐó là: cười thật nhiều, xinh đẹp thật nhiều, và tuyệt đối không được để những chuyện linh tinh làm hỏng tâm trạng nhé! 😂💕\n\nChúc em có một ngày 20/10 ngập tràn niềm vui, nhận được thật nhiều lời chúc dễ thương và có những khoảnh khắc khiến em vui đến mức tối nằm xuống vẫn còn mỉm cười.'},
{type:'text',tag:'CẢNH 2 · CHÚT ĐÁNG YÊU',title:'Chúc cô gái xinh đẹp 🌸',text:'Chúc Hoa mỗi sáng thức dậy đều thấy mình thật xinh, trang điểm lần nào cũng ưng ý, tóc tai ngoan ngoãn nghe lời, còn chiếc gương thì ngày nào cũng phải công nhận: “Hôm nay em vẫn là người xinh nhất!” 😂\n\nChúc em ăn món nào cũng ngon, đi đâu cũng gặp chuyện vui, mua món gì cũng vừa ý. Nếu có ngày không vui thì mong một ly nước ngon, một món ăn thích, hay một câu chuyện hài hước cũng đủ kéo nụ cười của em trở lại. 💕'},
{type:'text',tag:'CẢNH 3 · ĐIỀU ANH MONG',title:'Mong em luôn bình an 🌼',text:'Đùa vui là vậy, nhưng anh thật sự mong em luôn khỏe mạnh, bình an và có thật nhiều điều để mong chờ mỗi ngày.\n\nMong em không phải cố gắng mạnh mẽ mọi lúc, không cần giấu hết những mệt mỏi sau nụ cười. Có những ngày chậm lại một chút cũng chẳng sao, có những chuyện chưa làm được hôm nay thì ngày mai mình làm tiếp.\n\nEm hãy nhớ chăm sóc bản thân thật tốt nhé. Bởi vì em cũng xứng đáng nhận được sự quan tâm dịu dàng như cách em quan tâm đến những điều mình yêu quý.'},
{type:'text',tag:'CẢNH 4 · MỘT CHÚT DỊU DÀNG',title:'Gửi em một điều nhỏ 💗',text:'Anh mong những ngày sắp tới của em sẽ có nhiều nắng đẹp hơn những cơn mưa, nhiều tiếng cười hơn những lần thở dài, nhiều người chân thành hơn những điều khiến em phải bận lòng.\n\nVà nếu cuộc sống đôi lúc không chiều lòng em, mong em vẫn đủ bình tĩnh để bước tiếp, đủ yêu thương để chăm sóc chính mình, và đủ niềm tin để chờ đón những điều tốt đẹp phía trước. 🌸'},
{type:'photo',tag:'MỘT KHOẢNH KHẮC ĐẸP',:'ho1.jpg',text:'Mong em luôn tìm thấy những điều đẹp đẽ trên hành trình của mình. 🌊'},
{type:'photo',tag:'MỘT KHOẢNH KHẮC ĐẸP',:'ho2.jpg',text:'Mong nụ cười của em sẽ có thật nhiều hoàng hôn để nhớ. 🌅'},
{type:'photo',tag:'MỘT KHOẢNH KHẮC ĐẸP',:'ho3.jpg',text:'Mong mỗi ngày đều có một điều khiến em muốn lưu lại. 🌿'},
{type:'photo',tag:'MỘT KHOẢNH KHẮC ĐẸP',:'ho4.jpg',text:'Mong những điều bình thường cũng làm em thấy vui. 💕'},
{type:'photo',tag:'MỘT KHOẢNH KHẮC ĐẸP',:'ho5.jpg',text:'Mong em luôn tự tin với vẻ đẹp rất riêng của mình. 🌷'},
{type:'photo',tag:'MỘT KHOẢNH KHẮC ĐẸP',:'ho6.jpg',text:'Mong cuộc sống dịu dàng với em, hôm nay và cả mai sau. 🌱'},
{type:'photo',tag:'MỘT KHOẢNH KHẮC ĐẸP',:'ho7.jpg',text:'Mong những ngày phía trước của em có thật nhiều bình yên. 💗'},
{type:'photo',tag:'MỘT KHOẢNH KHẮC ĐẸP',:'ho8.jpg',text:'Mong em luôn có thời gian cho những điều mình yêu thích. ✨'},
{type:'photo',tag:'MỘT KHOẢNH KHẮC ĐẸP',:'ho9.jpg',text:'Cứ là Hoa nhé, theo cách riêng của em. 🌸'},
{type:'bouquet',tag:'MÓN QUÀ NHỎ DÀNH CHO HOA',title:'Một bó hoa gửi em 💐',text:'Bó hoa này không thể thay anh nói hết những điều muốn gửi đến em, nên anh mượn nó để chúc Hoa luôn rạng rỡ, dịu dàng và hạnh phúc theo cách riêng của mình.\n\nChúc em hôm nay vui, ngày mai vui, và cả những ngày chẳng có dịp gì đặc biệt cũng vẫn tìm thấy niềm vui trong cuộc sống. 🌹\n\nMong rằng khi nhìn thấy bó hoa này, em sẽ nhớ rằng có người đã dành thời gian chuẩn bị một món quà nhỏ, chỉ với mong muốn nhìn thấy em mỉm cười.'},
{type:'text',tag:'ĐIỀU ANH MUỐN NÓI',title:'Hoa à… ❤️',text:'Anh không biết sau này chúng ta sẽ hiểu nhau đến đâu, nhưng anh biết rằng hiện tại anh thật lòng quý em.\n\nNếu em cảm thấy thoải mái, anh mong mình có thể tiếp tục tìm hiểu nhau từ từ, cùng chia sẻ những câu chuyện thường ngày, quan tâm nhau bằng những điều giản dị và để mọi thứ diễn ra tự nhiên.\n\nAnh không muốn em cảm thấy áp lực hay phải đưa ra câu trả lời nào cả. Anh chỉ muốn thành thật với tình cảm của mình, đồng thời tôn trọng cảm xúc và lựa chọn của em.'},
{type:'text',tag:'CẢNH CUỐI · 20/10',title:'Chúc mừng 20/10, Hoa nhé! 🌹',text:'Mong cô gái mang tên Hoa sẽ luôn nở rộ theo cách của riêng mình, không cần trở thành ai khác, cũng không cần cố gắng để làm hài lòng tất cả mọi người.\n\nCứ vui vẻ, cứ dịu dàng, cứ sống với những điều em yêu thích.\n\nMong em luôn bình an, luôn được trân trọng và luôn có thật nhiều hạnh phúc.\n\nChúc em một ngày 20/10 thật đẹp! 🌷💗'}
];
let idx=-1;const card=document.getElementById('card');function render(){const s=scenes[idx];let media='';if(s.type==='photo')media=`<img class="photo" src="assets/${s.img}" alt="Ảnh kỷ niệm của Hoa">`;if(s.type==='bouquet')media='<img class="photo" src="assets/bo-hoa-tho-hong.jpg" alt="Bó hoa thỏ màu hồng">';card.innerHTML=`<div class="eyebrow">${s.tag||''}</div>${s.title?`<h1 class="title">${s.title}</h1>`:''}${media}${s.text?`<p class="copy">${s.text}</p>`:''}<button class="btn" id="next">${idx===scenes.length-1?'Xem lại từ đầu 💗':'Tiếp tục 💗'}</button><div class="dots">${idx+1} / ${scenes.length}　♡</div>`;document.getElementById('next').onclick=()=>{if(idx===scenes.length-1){idx=-1;intro()}else{idx++;render();sprinkle()}}}
function intro(){card.innerHTML='<div class="eyebrow">Dành riêng cho Hoa</div><div class="heart">💗</div><h1 class="title">Sẵn sàng chưa?</h1><p class="copy">Một món quà nhỏ đang chờ em mở nè.</p><button class="btn" id="start">Mở quà 💝</button>';document.getElementById('start').onclick=countdown}function countdown(){let n=3;card.innerHTML='<div class="eyebrow">Một điều dễ thương sắp bắt đầu</div><div class="count" id="num">3</div><div class="heart">💗</div>';const el=document.getElementById('num');const timer=setInterval(()=>{n--;if(n>0)el.textContent=n;else{clearInterval(timer);idx=0;render();sprinkle()}},850)}document.getElementById('start').onclick=countdown;
function sprinkle(){for(let i=0;i<13;i++){const e=document.createElement('span');e.className='floating';e.textContent=['💗','💕','🌸','✨','💖'][Math.floor(Math.random()*5)];e.style.left=Math.random()*95+'vw';e.style.top=(45+Math.random()*45)+'vh';e.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}}for(let i=0;i<22;i++){let e=document.createElement('span');e.className='petal';e.textContent=['♡','♥','🌸'][i%3];e.style.left=Math.random()*100+'%';e.style.animationDuration=(8+Math.random()*12)+'s';e.style.animationDelay=(-Math.random()*20)+'s';e.style.fontSize=(12+Math.random()*16)+'px';document.getElementById('petals').appendChild(e)}
</script></body></html>
